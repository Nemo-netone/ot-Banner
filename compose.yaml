services:
  server:
    build:
      context: .
      target: server
    environment:
      SERVER_ADDR: ":8080"
      RULES_FILE: "/app/configs/fingerprints.json"
      MAX_BODY_BYTES: "8388608"
      MAX_BATCH_SIZE: "1000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck", "--url", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  client:
    build:
      context: .
      target: client
    profiles:
      - client
    depends_on:
      server:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - ./testdata:/data:ro
    command: ["--file", "/data/input.json", "--server", "http://server:8080"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
